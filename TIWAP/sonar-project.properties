sonar.projectKey=tiwap
sonar.projectName=TIWAP
sonar.projectVersion=1.0
sonar.sources=.
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3
# shortcut: l'analyseur JS/HTML plante sous émulation amd64 (image scanner sans arm64) ;
# le TP porte sur le Python. Retirer cette ligne pour analyser aussi les templates (XSS).
sonar.exclusions=tests/**,**/*.js,**/*.html,**/*.css
